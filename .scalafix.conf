rules = [
  DisableSyntax,
  ExplicitResultTypes,
  ForbiddenSymbol,
  OptionGet,
  TryGet,
  EitherGet,
  UnsafeTraversableMethods,
  CatchFatal,
  SwallowedException,
  CollectionPromotionToAny,
  MethodReturningAny,
  OrganizeImports,
  RedundantSyntax,
  RemoveUnused
]

DisableSyntax {
  noVars = true
  noNulls = true
  noThrows = true
  noReturns = true
  noAsInstanceOf = true
  noValPatterns = true
}

ExplicitResultTypes.fatalWarnings = true

# Safety diagnostics must fail checks even when an external rule defaults to warning severity.
lint.error = ".*"

ForbiddenSymbol.symbols = [
  "scala.Predef.require",
  # EitherGet only recognizes receivers typed as Left or Right, not a general Either.
  "scala.util.Either.LeftProjection.get",
  "scala.util.Either.RightProjection.get",
  # Supplement UnsafeTraversableMethods, whose inheritance lookup misses Scala 3 List methods.
  "scala.collection.IterableOps.head",
  "scala.collection.IterableOps.tail",
  "scala.collection.IterableOps.init",
  "scala.collection.IterableOps.last",
  "scala.collection.IterableOnceOps.reduce",
  "scala.collection.IterableOnceOps.reduceLeft",
  "scala.collection.IterableOnceOps.reduceRight",
  "scala.collection.IterableOnceOps.max",
  "scala.collection.IterableOnceOps.maxBy",
  "scala.collection.IterableOnceOps.min",
  "scala.collection.IterableOnceOps.minBy",
  "scala.collection.immutable.List.tail",
  "scala.collection.immutable.List.last"
]

OrganizeImports.groupedImports = Merge
OrganizeImports.targetDialect = Scala3

# OrganizeImports owns import rewrites to avoid overlapping patches.
RemoveUnused.imports = false
